# ── General ───────────────────────────────────────────────────────────────────

language = "en-US"        # UI language; defaults to $LC_MESSAGES / $LANG
outputs = "All"            # "All" (default), "Active", or { Targets = ["eDP-1"] }
position = "Top"             # "Top" (default) or "Bottom"
enable_esc_key = true     # Pressing Escape closes open menus

# ── Logging ───────────────────────────────────────────────────────────────────

[logging]
level = "warn"             # (default) "error", "warn", "info", or "debug"; supports per-module filters
target = "file"            # (default) "file", "stdout", or "stderr"
directory = "~/.local/log" # (default: $XDG_RUNTIME_DIR) supports ~ and $VAR

# ── Modules ───────────────────────────────────────────────────────────────────

[modules]
left = [ [ "appLauncher", "Updates", "Workspaces" ] ]
center = [ "WindowTitle", "Clipboard", "MediaPlayer"]
right = [ "SystemInfo", [ "Tray", "Tempo","Privacy", "Settings" ] ]

# ── Updates ───────────────────────────────────────────────────────────────────

# Package update checks; needs pacman-contrib (checkupdates), paru and alacritty
[updates]
check_cmd = "checkupdates; paru -Qua"
update_cmd = 'alacritty -e bash -c "paru; echo Done - Press enter to exit; read" &'
interval = 3600             # seconds (default); effective minimum at runtime is 60

# ── Workspaces ────────────────────────────────────────────────────────────────

[workspaces]
visibility_mode = "All"           # "All" (default), "MonitorSpecific", "MonitorSpecificExclusive"
indicator_format = "Name"         # "Name" (default) or "NameAndIcons" to show app icons
group_by_monitor = false          # (default)
enable_workspace_filling = true  # (default)
max_workspaces = 10               # (default: None) max number of workspaces when filling

# ── Custom Modules ────────────────────────────────────────────────────────────

# Left-bar launcher button; opens rofi's application list
[[CustomModule]]
name = "appLauncher"
icon = "󰣇"
command = "rofi -show drun"
icons = { "regex" = "icon" }   # map regex on `alt` to icon
alert = "regex"                # show alert dot when `alt` matches regex
type = "Button"                # (default) "Button" or "Text"

# ── Window Title ──────────────────────────────────────────────────────────────

[window_title]
mode = "InitialTitle"                   # "Title" (default), "Class", "InitialTitle", "InitialClass"
truncate_title_after_length = 250 # (default) 0 means no truncation; capped at 2048

# ── System Info ───────────────────────────────────────────────────────────────

[system_info]
indicators = [ "Cpu", "Memory", "Temperature",]
interval = 10

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.temperature]
warn_threshold = 60     # (default: None, auto 60°C / 140°F based on unit system)
alert_threshold = 80    # (default: None, auto 80°C / 176°F based on unit system)
sensor = "Cpu"        # (default) type keyword: "Cpu", "Gpu", "Acpi", "Nvme" or exact label like "acpitz temp1"
units = "Celsius"       # (default: None = follow the unit system) or "Fahrenheit"

[system_info.disk]
warn_threshold = 80     # (default)
alert_threshold = 90    # (default)
format = "Percentage"   # (default) or "Fraction"

# ── Tray ──────────────────────────────────────────────────────────────────────

[tray]
blocklist = ["regex"]    # (default: []) hide tray items matching regex patterns
right_click = "Menu"     # (default: None) "Open" or "Menu"; sets right-click action, left click gets the complement

# ── Tempo ─────────────────────────────────────────────────────────────────────

[tempo]
formats = [ "%a %d %b %I:%M %p", "%Y-%m-%d %I:%M:%S %p", "%I:%M:%S %p" ]
timezones = ["America/New_York"]
weather_location = "Current"
weather_indicator = "IconAndTemperature"  # (default), "Icon", or "None"

# ── Notifications ─────────────────────────────────────────────────────────────

[notifications]
format = "%I:%M %p"
show_timestamps = true
show_bodies = true
grouped = true           # (default) group notifications by app
toast = true              # (default) enable toast popups
toast_position = "TopCenter"  # (default) "TopLeft", "TopRight", "TopCenter", "BottomLeft", "BottomRight", "BottomCenter"

# Clipboard history picker; needs a `cliphist-rofi-img` script on PATH plus cliphist and wl-clipboard
[[CustomModule]]
name = "Clipboard"
icon = "📋"
command = "cliphist-rofi-img | wl-copy"


[media_player]
# Now playing widget (MPRIS) with an audio visualizer
indicator_format = "Icon"
indicator_visualizer = "Before" # "Before", "After", or "Background"
visualizer_framerate = 30

# ── Settings ──────────────────────────────────────────────────────────────────

[settings]
enable_tooltips = true   # (default) set to false to disable hover tooltips
# Pauses media, then locks. `nixGL` is only needed on Nix; remove it on other distros.
lock_cmd = "playerctl --all-players pause; nixGL hyprlock &"
shutdown_cmd = "shutdown now"                   # (default)
suspend_cmd = "systemctl suspend"               # (default)
reboot_cmd = "systemctl reboot"                 # (default)
logout_cmd = "loginctl kill-user $(whoami)"     # (default)
audio_sinks_more_cmd = "pipemixer"
audio_sources_more_cmd = "pipemixer"
audio_sink_post_switch_cmd = "systemctl --user restart wireplumber"   # (default: None)
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "bluetui"
battery_format = "IconAndPercentage"  # (default), "Icon", "Percentage", "IconAndPercentage", "Time", "IconAndTime", "Name", "IconAndName", "PercentageAndTime", "IconAndPercentageAndTime"
peripheral_indicators = "All"   # (default) or { Specific = ["Keyboard", "Mouse", "Headphones", "Gamepad"] }
peripheral_expanded_by_default = true  # (default)
audio_indicator_format = "Icon"        # (default), "IconAndPercentage", "Percentage", etc.
microphone_indicator_format = "Icon"   # (default)
network_indicator_format = "Icon"      # (default), "IconAndPercentage", "Percentage", "Name", "IconAndName" (Name/IconAndName show the SSID/interface/VPN name)
bluetooth_indicator_format = "Icon"    # (default)
brightness_indicator_format = "Icon"   # (default)
volume_step = 5    # (default) step size for IPC volume up/down, range 1..=50
max_volume = 100   # (default) max volume level, range 1..=200 (>100 enables overdrive)
indicators = [ "IdleInhibitor", "PowerProfile", "Audio", "Microphone", "Bluetooth", "Network", "Vpn", "Battery", "Brightness" ]

# ── OSD ───────────────────────────────────────────────────────────────────────

[osd]
enabled = true   # (default)
timeout = 1500    # milliseconds
show_volume_percentage = true      # (default) show numeric volume value in the OSD
show_brightness_percentage = true  # (default) show numeric brightness value in the OSD

# ── Animations ────────────────────────────────────────────────────────────────

[animations]
enabled = false   # (default)

# ── Appearance ────────────────────────────────────────────────────────────────

[appearance]
font_name = "JetBrains Mono Nerd Font"
primary_color = "#fb3daf"
success_color = "#cc3fff"
warning_color = "#e0af68"
danger_color = "#f7768e"
text_color = "#ffffff"

workspace_colors = [ "#57cef8", "#9ece6a" ]

[appearance.background_color]
base = "#ff69b4"
weak = "#57cef8"
strong = "#e852ff"

