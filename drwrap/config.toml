# drwrap configuration — every key is optional.
# Generated by `drwrap config init`.

# Resolve edition. Studio unlocks auto-import + in-place healing.
[edition]
studio = "auto"  # true | false | "auto" (probe the scripting API)

# FFmpeg codec pipeline and the on-disk transcode cache.
[transcode]
codec = "dnxhr"  # "dnxhr" | "prores"
hwaccel = "auto"  # auto | nvdec | vaapi | none
gpu_codecs = false  # pass VP9/AV1 through if the GPU decodes them
workers = 2
cache_dir = "/home/tigerclips1/.cache/drwrap"
cache_max_gb = 50.0
dnxhr_profile = "auto"  # auto | lb | sq | hq | hqx | 444
prores_profile = 3  # 0 proxy .. 3 HQ .. 5 4444XQ
audio_bits = 16  # PCM depth for video audio: 16 | 24 | 32
wav_bits = 24  # PCM depth for audio-only files: 16 | 24 | 32
vfr_fallback_fps = "30000/1001"  # CFR rate when source fps is unknown

# Folders the daemon watches / stages converted files into.
[watch]
folder = "/home/tigerclips1/Videos/ResolveDrop"
ready_folder = "/home/tigerclips1/Videos/ResolveIngest"  # staging for Free / failed imports

# XDND drop-overlay window (X11/XWayland). Off on Hyprland by auto.
[shim]
enabled = "auto"
region = "full"  # full | media-pool (top-left area only)
border_color = 0xFF2E9AFE  # armed-state highlight, 0xAARRGGBB

# Native Ctrl+<key> clipboard-file paste onto Resolve's window.
[paste]
hotkey = true  # master on/off for Ctrl+<key> paste
key = "v"  # single X keysym combined with Ctrl

# Heal codec-broken clips already imported into the pool.
[poolwatch]
enabled = true
interval = 2.0  # media-pool poll seconds

# Desktop notifications.
[notify]
enabled = true
progress = true  # progress bar while converting

# Media-pool import target.
[import]
bin = "Ingest"
to_timeline = false
placement = "playhead"  # "playhead" (free track at playhead) | "end"

# Resolve binary + scripting API locations.
[launcher]
resolve_bin = "/opt/resolve/bin/resolve"
api_dir = "/opt/resolve/Developer/Scripting"
lib_path = "/opt/resolve/libs/Fusion/fusionscript.so"
window_class = "resolve"
