# Colors inspired by the femboy pride flag (pink / light pink / white / blue).
# NOTE: this file was originally generated by matugen. If matugen is still enabled
# for hyprlock it will overwrite these values, so disable that template or keep a copy.
# Imported by hyprlock.conf; the font families must be installed.

# Flag palette
$flag_pink = rgba(d260a5FF)
$flag_light_pink = rgba(e4afcdFF)
$flag_white = rgba(fefefeFF)
$flag_blue = rgba(57cef8FF)

$text_color = rgba(fefefeFF)
$entry_background_color = rgba(1a0f1ccc)
$entry_border_color = rgba(d260a5FF)
$entry_color = rgba(fefefeFF)
$entry_check_color = rgba(57cef8FF)
$entry_fail_color = rgba(d260a5FF)
$entry_caps_color = rgba(e4afcdFF)
$accent_color = rgba(e4afcdFF)

$font_family = Google Sans Flex Medium
$font_family_clock = Google Sans Flex Medium
$font_material_symbols = Material Symbols Rounded