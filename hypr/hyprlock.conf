# Lock screen layout. Colors and fonts come from colors.conf.
source=~/.config/hypr/hyprlock/colors.conf

# Wallpaper background (blurred slightly, with a soft dark tint for readability)
background {
    monitor =
    path = $HOME/Pictures/Wallpaper/astolfo-background-ks8hig2anu6av4ya.jpg
    color = rgba(181818FF) # fallback if the image can't be loaded
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
    contrast = 1.0
    vibrancy = 0.2
}

# Password box
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    check_color = $entry_check_color
    fail_color = $entry_fail_color
    capslock_color = $entry_caps_color
    fade_on_empty = true
    rounding = 25

    position = 0, 20
    halign = center
    valign = center
}

label { # Keyboard layout
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $flag_blue
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $flag_white
    font_size = 65
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $accent_color
    font_size = 17
    font_family = $font_family_clock

    position = 0, 240
    halign = center
    valign = center
}

label { # User (icon + current username)
    monitor =
    text =     $USER
    color = $flag_pink
    font_size = 20
    font_family = $font_family

    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status (battery info from status.sh, refreshed every 5s)
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $flag_blue
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}