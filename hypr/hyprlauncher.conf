# Launcher config (daemon started in autostart.lua, opened via keybind)

ui {
    window_size = 600 400 # width height in pixels
}

finders {
    desktop_icons = true
    # Start a query with "=" to evaluate a math expression
    math_prefix = =
}

# Remember usage to rank frequently launched apps higher
cache {
    enabled = true
}

general {
    # Take keyboard focus when opened
    grab_focus = true
}
