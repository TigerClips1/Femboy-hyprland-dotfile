# Idle daemon: lock, then turn off the screen, then suspend.
# NOTE: $lock_cmd is currently commented out, so general.lock_cmd is empty.
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    # Lock before the system goes to sleep
    before_sleep_cmd = loginctl lock-session
    # Wait for the lock screen to be ready before suspending
    inhibit_sleep = 3
}

# Lock the session
listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

# Turn the display off, and back on at the next input
listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend the machine
listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}